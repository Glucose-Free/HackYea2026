name: ai-control-layer

x-gateway-env: &gateway-env
  GATEWAY_API_KEY: ${GATEWAY_API_KEY:-demo-gateway-key}
  REPORT_ACCESS_TOKEN: ${REPORT_ACCESS_TOKEN:-demo-report-token}
  TYPESAFE_API_KEY: ${TYPESAFE_API_KEY:-}
  CHAT_MODEL_API_KEY: ${CHAT_MODEL_API_KEY:-}
  GATEWAY_CONFIG_PATH: /app/config/gateway.toml
  GATEWAY_CONFIG_HISTORY_DIR: /data/config/history
  AUDIT_LOG_PATH: /data/audit/audit.jsonl
  # A separate volume, so replacing or truncating the log file alone is caught by /audit/verify.
  AUDIT_ANCHOR_PATH: /data/anchor/audit.anchor.json

services:
  gateway:
    build: .
    environment: *gateway-env
    volumes:
      - gateway-data:/data
      - audit-anchor:/data/anchor
      # The repo's config directory, not a copy: editing config/gateway.toml reloads the running guards.
      # A directory mount, because the config store replaces the file atomically.
      - ./config:/app/config
    networks: [frontend, backend]
    ports:
      - "8000:8000"
    depends_on:
      data-mcp:
        condition: service_healthy

  data-mcp:
    # Checkpoint 2: the Datalog policy engine over the demo's data tools.
    # No published port: the server trusts the user id the gateway sends, so only the gateway may reach it.
    build: .
    command: ["python", "-m", "deploy.policy_mcp.server"]
    environment:
      POLICY_DB_PATH: /data/policy/knowledge.sqlite3
    volumes:
      - policy-data:/data/policy
    networks: [backend]
    healthcheck:
      test: ["CMD", "python", "-c", "import socket; socket.create_connection(('127.0.0.1', 8001), 2)"]
      interval: 5s
      timeout: 3s
      retries: 12

  open-webui:
    image: ghcr.io/open-webui/open-webui:main
    ports:
      - "3000:8080"
    environment:
      OPENAI_API_BASE_URL: http://gateway:8000/v1
      OPENAI_API_KEY: ${GATEWAY_API_KEY:-demo-gateway-key}
      ENABLE_OLLAMA_API: "false"
      ENABLE_FORWARD_USER_INFO_HEADERS: "true"
      ENABLE_PERSISTENT_CONFIG: "false"
      ENABLE_SIGNUP: "false"
      # Open WebUI hides connection models from non-admin users until an admin shares them; the demo users need the gateway's model.
      BYPASS_MODEL_ACCESS_CONTROL: "true"
      # The gateway exposes one model; preselect it and drop Open WebUI's built-in "arena" comparison model.
      DEFAULT_MODELS: company-assistant
      ENABLE_EVALUATION_ARENA_MODELS: "false"
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-admin@demo.local}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-demo-admin-password}
      WEBUI_SECRET_KEY: ${WEBUI_SECRET_KEY:-change-me}
      # Background tasks would otherwise send extra prompts through checkpoint 1 and into the audit log.
      ENABLE_TITLE_GENERATION: "false"
      ENABLE_TAGS_GENERATION: "false"
      ENABLE_FOLLOW_UP_GENERATION: "false"
      ENABLE_AUTOCOMPLETE_GENERATION: "false"
      ENABLE_RETRIEVAL_QUERY_GENERATION: "false"
      ENABLE_SEARCH_QUERY_GENERATION: "false"
      # No data path may bypass the gateway.
      ENABLE_WEB_SEARCH: "false"
      ENABLE_CODE_INTERPRETER: "false"
      ENABLE_IMAGE_GENERATION: "false"
    volumes:
      - open-webui-data:/app/backend/data
    networks: [frontend]
    depends_on:
      gateway:
        condition: service_healthy

  seed-users:
    build: .
    command: ["python", "deploy/open_webui/seed_users.py"]
    environment:
      OPEN_WEBUI_URL: http://open-webui:8080
      WEBUI_ADMIN_EMAIL: ${WEBUI_ADMIN_EMAIL:-admin@demo.local}
      WEBUI_ADMIN_PASSWORD: ${WEBUI_ADMIN_PASSWORD:-demo-admin-password}
      DEMO_USER_PASSWORD: ${DEMO_USER_PASSWORD:-demo-user-password}
    depends_on:
      - open-webui
    networks: [frontend]
    restart: "no"

networks:
  frontend:
  # Only the gateway joins both networks, so nothing else can reach data-mcp and claim a user id.
  backend:
    internal: true

volumes:
  gateway-data:
  policy-data:
  audit-anchor:
  open-webui-data:
